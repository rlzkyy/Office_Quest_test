<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OFFICE QUEST — The Archive Mission (Solo + Multiplayer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --g: #1f4d3a;
      --g2: #2f6b50;
      --cr: #f8efd9;
      --br: #8b5e3c;
      --gold: #f2b134;
      --co: #ef6f5e;
      --sky: #4fb3d9;
      --li: #9b7fd1;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #0f2a20;
      font-family: Fredoka, "Trebuchet MS", Verdana, sans-serif;
      color: #2a2118
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 100%;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(160deg, #f8efd9, #f6d9b0)
    }

    .scr {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      text-align: center
    }

    .scr.on {
      display: flex
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0
    }

    .scr>*:not(.bg) {
      position: relative;
      z-index: 1
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(#2f8a64, #1f4d3a);
      color: #fff;
      padding: 10px 18px;
      font-weight: 700;
      box-shadow: 0 4px 0 #123226;
      transition: transform .1s
    }

    button:hover {
      transform: translateY(-1px)
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #123226
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--gold)
    }

    button.alt {
      background: linear-gradient(#b27b52, #8b5e3c);
      box-shadow: 0 4px 0 #5a3b22
    }

    button.gold {
      background: linear-gradient(#ffd266, #f2b134);
      color: #3a2a10;
      box-shadow: 0 4px 0 #b07a14
    }

    button.sm {
      padding: 6px 10px;
      font-size: 13px
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 9vw, 72px);
      letter-spacing: 3px;
      background: linear-gradient(#fff3b8, #f2b134 60%, #ef6f5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #1f4d3a) drop-shadow(0 8px 6px rgba(0, 0, 0, .35))
    }

    h2 {
      margin: 0 0 6px;
      color: var(--g)
    }

    .tag {
      background: linear-gradient(90deg, #fff8e6, #ffe9b8);
      padding: 6px 16px;
      border-radius: 20px;
      color: var(--g);
      font-weight: 700;
      border: 2px solid var(--gold)
    }

    .start {
      font-size: 26px;
      padding: 14px 56px;
      animation: pulse 1.6s infinite
    }

    @keyframes pulse {
      50% {
        transform: scale(1.06)
      }
    }

    .ov {
      position: absolute;
      inset: 0;
      background: rgba(15, 42, 32, .78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 5
    }

    .ov.on {
      display: flex
    }

    .card2 {
      background: var(--cr);
      border: 4px solid var(--br);
      border-radius: 16px;
      padding: 16px;
      max-width: 640px;
      width: 100%;
      max-height: 100%;
      overflow: auto;
      text-align: left;
      line-height: 1.45;
      box-shadow: 0 10px 30px #0008
    }

    .ph {
      background: linear-gradient(90deg, var(--g), var(--g2));
      color: #fff;
      margin: -16px -16px 10px;
      padding: 10px 16px;
      border-radius: 10px 10px 0 0;
      font-size: 18px
    }

    .mat {
      background: #e3f2e8;
      border-left: 6px solid var(--sky);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 14px
    }

    .mat b {
      display: block
    }

    .note {
      background: #fff3c4;
      border: 2px dashed var(--gold);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 8px 0;
      font-size: 14px
    }

    .pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 56px;
      padding: 8px;
      background: #ffffff88;
      border-radius: 12px;
      margin: 6px 0
    }

    .chip {
      background: #fff;
      border: 2px solid var(--br);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      box-shadow: 0 3px 0 #0003;
      max-width: 230px
    }

    .chip.drag {
      cursor: grabbing;
      transform: rotate(-3deg) scale(1.05);
      box-shadow: 0 10px 18px #0006
    }

    .chip.lk {
      opacity: .35;
      cursor: not-allowed
    }

    .chip.done {
      cursor: default;
      background: #e9fbe9;
      border-color: #2f8a64;
      box-shadow: none;
      max-width: 100%
    }

    .zones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px
    }

    .zone {
      --zc: #4aa89b;
      border: 3px dashed var(--zc);
      border-radius: 12px;
      background: #fff;
      min-height: 84px;
      padding: 6px;
      transition: .2s
    }

    .zone:nth-child(4n+2) {
      --zc: #e0a93b
    }

    .zone:nth-child(4n+3) {
      --zc: #ef6f5e
    }

    .zone:nth-child(4n+4) {
      --zc: #9b7fd1
    }

    .zl {
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      background: var(--zc);
      border-radius: 6px;
      padding: 3px 6px;
      margin-bottom: 5px
    }

    .zone.ok {
      border-style: solid;
      background: #f4fff4
    }

    .zone.shake {
      animation: sh .35s
    }

    @keyframes sh {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    .fbk {
      min-height: 44px;
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: #fff;
      font-size: 14px
    }

    .fbk.g {
      background: #d8f3de;
      color: #14602e
    }

    .fbk.r {
      background: #fbd9d4;
      color: #8a1f12
    }

    .fbk.h {
      background: #fff0b8;
      color: #6a4b00
    }

    .bar {
      height: 10px;
      background: #ddd;
      border-radius: 6px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--sky), var(--gold));
      transition: width .3s
    }

    .big {
      font-size: 42px;
      margin: 4px 0
    }

    .wa .wh {
      background: #075e54;
      color: #fff;
      margin: -16px -16px 10px;
      padding: 10px 16px
    }

    .bub {
      background: #dcf8c6;
      border-radius: 12px 12px 12px 2px;
      padding: 8px 10px;
      margin: 6px 0;
      max-width: 92%;
      animation: pop .3s
    }

    @keyframes pop {
      from {
        transform: scale(.85);
        opacity: 0
      }
    }

    #dlg {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      background: rgba(255, 248, 230, .97);
      border: 4px solid var(--gold);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: left;
      z-index: 2
    }

    #dn {
      font-weight: 700;
      color: var(--co)
    }

    #dt {
      min-height: 3.8em;
      font-size: 15px
    }

    .pick {
      display: flex;
      gap: 10px
    }

    .pick button {
      background: #fff;
      color: var(--g);
      box-shadow: 0 4px 0 #0003;
      border: 3px solid var(--g)
    }

    .pick button.on {
      background: linear-gradient(#ffd266, #f2b134);
      color: #3a2a10;
      border-color: #b07a14
    }

    input {
      font: inherit;
      padding: 10px;
      border-radius: 10px;
      border: 3px solid var(--br);
      width: 220px;
      text-align: center
    }

    .nav {
      display: flex;
      gap: 30px
    }

    .nav button {
      font-size: 24px;
      padding: 8px 22px
    }

    #hud {
      width: 100%;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 14px;
      background: linear-gradient(90deg, #1f4d3a, #2f8a64);
      color: #fff;
      padding: 6px 10px;
      border-radius: 12px;
      border: 2px solid var(--gold)
    }

    #hud .bar {
      flex: 1;
      min-width: 70px
    }

    #cM {
      flex: 1;
      min-height: 0;
      width: 100%;
      object-fit: contain;
      background: #0f2a20;
      border-radius: 10px;
      touch-action: none;
      border: 3px solid var(--br)
    }

    #ctl {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .dp {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 40px);
      gap: 3px
    }

    .dp button {
      padding: 0;
      background: linear-gradient(#5bc0e8, #2d86b0);
      box-shadow: 0 3px 0 #1a5675;
      user-select: none;
      touch-action: none
    }

    #ab {
      display: none;
      flex: 1;
      background: linear-gradient(#ffd266, #f2b134);
      color: #3a2a10;
      box-shadow: 0 4px 0 #b07a14
    }

    #tt {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2118;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      z-index: 9;
      display: none;
      max-width: 90%;
      text-align: center;
      font-size: 14px
    }

    .cf {
      position: absolute;
      top: -30px;
      z-index: 9;
      font-size: 24px;
      animation: fall 2s linear forwards;
      pointer-events: none
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg)
      }
    }

    .card2 {
      background: linear-gradient(#fffaf0, #f8efd9)
    }

    .zone.hov {
      transform: scale(1.05);
      background: #fffbe0;
      box-shadow: 0 0 0 4px #f2b13466
    }

    .chip:not(.lk):not(.done):not(.drag):hover {
      transform: translateY(-3px) rotate(-1deg)
    }

    .tag {
      box-shadow: 0 3px 0 #b07a14
    }

    #hud {
      box-shadow: 0 4px 12px #0005
    }

    #cM {
      box-shadow: 0 8px 24px #000a, inset 0 0 0 2px #f2b134
    }

    .ph {
      font-size: 20px;
      text-shadow: 0 2px 0 #0004
    }

    h1 {
      animation: fl 3s ease-in-out infinite
    }

    @keyframes fl {
      50% {
        transform: translateY(-6px)
      }
    }

    .zl {
      text-shadow: 0 1px 0 #0003
    }

    #app {
      background: linear-gradient(160deg, #ffe8c8, #ffd6e0 45%, #d6ecff)
    }

    .ph {
      background: linear-gradient(90deg, var(--lc, #1f4d3a), color-mix(in srgb, var(--lc, #2f6b50) 55%, #f2b134))
    }

    .card2 {
      border-color: var(--lc, #8b5e3c)
    }

    .mat {
      border-left-color: var(--lc, #4fb3d9);
      background: color-mix(in srgb, var(--lc, #4fb3d9) 14%, #fff)
    }

    .pool .chip:nth-child(5n+1) {
      background: #ffe3df;
      border-color: #ef6f5e
    }

    .pool .chip:nth-child(5n+2) {
      background: #fff1c9;
      border-color: #f2b134
    }

    .pool .chip:nth-child(5n+3) {
      background: #dff3ff;
      border-color: #4fb3d9
    }

    .pool .chip:nth-child(5n+4) {
      background: #eadfff;
      border-color: #9b7fd1
    }

    .pool .chip:nth-child(5n+5) {
      background: #dcf5e6;
      border-color: #2f9d74
    }

    .zone {
      background: color-mix(in srgb, var(--zc) 12%, #fff)
    }

    .zone.ok {
      background: color-mix(in srgb, var(--zc) 22%, #fff)
    }

    #hud {
      background: linear-gradient(90deg, #1f8a6a, #3d7fd1 60%, #8a5fd1)
    }

    #dlg {
      border-color: var(--co);
      background: linear-gradient(#fff8e6, #ffe9d6)
    }

    .tag {
      background: linear-gradient(90deg, #fff8e6, #ffe0e6 50%, #dff1ff)
    }

    .dp button:nth-child(2) {
      background: linear-gradient(#ff8f7e, #e0553f);
      box-shadow: 0 3px 0 #8e2f20
    }

    .dp button:nth-child(4) {
      background: linear-gradient(#ffd266, #e0a02a);
      box-shadow: 0 3px 0 #8a5f0a
    }

    .dp button:nth-child(5) {
      background: linear-gradient(#b79bf0, #7d5fc4);
      box-shadow: 0 3px 0 #4a3480
    }

    .bar i {
      background: linear-gradient(90deg, #4fb3d9, #9b7fd1, #ef6f5e, #f2b134)
    }

    button.start {
      background: linear-gradient(#ffb199, #ef6f5e);
      color: #fff;
      box-shadow: 0 5px 0 #a8402f
    }

    .ps {
      position: absolute;
      left: 0;
      width: 130px;
      height: 60px;
      background: #fff repeating-linear-gradient(#fff 0 10px, #d8e2e8 10px 11px);
      border: 1px solid #999;
      font-size: 11px;
      padding: 4px;
      transition: top .5s, background .5s;
      box-shadow: 0 2px 4px #0003;
      text-align: center
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    .belt {
      position: relative;
      height: 74px;
      background: repeating-linear-gradient(90deg, #5a5a66 0 18px, #4a4a55 18px 36px);
      border-radius: 10px;
      overflow: hidden;
      border: 3px solid #333;
      margin: 8px 0
    }

    .bitem {
      position: absolute;
      top: 8px;
      background: #fff;
      border: 2px solid var(--br);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      width: 52%;
      box-shadow: 0 3px 0 #0004
    }

    .bins {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .bin {
      flex: 1;
      min-width: 100px;
      color: #fff;
      text-shadow: 0 1px 0 #0005
    }

    .pcol {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .pcol>div {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .pb {
      background: #fff;
      color: #2a2118;
      border: 2px solid var(--br);
      text-align: left;
      font-size: 13px;
      box-shadow: 0 3px 0 #0003
    }

    .pb:hover {
      background: #eef5ea
    }

    .pb.sel {
      background: #fff1c9;
      border-color: var(--gold);
      transform: translateX(4px)
    }

    .pb.lk {
      cursor: default
    }

    .pb.shake {
      animation: sh .35s
    }

    .rot {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0
    }

    .rs {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      opacity: .55;
      transform: scale(.8)
    }

    .rs.fr {
      opacity: 1;
      transform: scale(1.15);
      box-shadow: 0 6px 14px #0006
    }

    .igrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin: 6px 0
    }

    .ic {
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      position: relative
    }

    .ie {
      font-size: 28px;
      display: block
    }

    .fl {
      display: none;
      position: absolute;
      top: 4px;
      right: 6px
    }

    .ic.flag {
      border-color: #e0553f;
      background: #fff0ee
    }

    .ic.flag .fl {
      display: block
    }

    .ic.okc {
      border-color: #2f9d74
    }

    .ic.noc {
      border-color: #a22;
      background: #fbd9d4
    }

    .sheet {
      background: #fff;
      border: 1px solid #999;
      margin: 8px auto;
      width: 260px;
      max-width: 100%;
      padding: 8px;
      font-size: 12px;
      box-shadow: 0 2px 6px #0003;
      text-align: left
    }

    .stp {
      margin-top: 8px;
      border: 2px dashed #aaa;
      min-height: 30px;
      text-align: center;
      font: 700 20px monospace;
      padding: 3px
    }

    .numr {
      background: #e9eef7;
      border: 3px solid #6b7fa8;
      border-radius: 12px;
      padding: 8px;
      margin-top: 8px
    }

    .dgs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .dgs>div {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px
    }

    .dg {
      font: 700 28px monospace;
      background: #222;
      color: #7be0ff;
      width: 40px;
      text-align: center;
      border-radius: 6px
    }

    .fig {
      display: flex;
      justify-content: space-around;
      margin: 6px 0
    }

    .fig span {
      font-size: 30px;
      text-align: center;
      opacity: .25;
      filter: grayscale(1);
      transition: .4s
    }

    .fig span small {
      display: block;
      font-size: 11px
    }

    .fig span.lit {
      opacity: 1;
      filter: none;
      transform: scale(1.15)
    }

    .bx {
      border: 3px solid #8b5e3c;
      background: #fff;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-weight: 700;
      margin: 0 auto 6px;
      width: 140px
    }

    .rw {
      display: grid;
      grid-template-columns: 1.5fr 1.5fr 44px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      margin: 4px 0
    }

    #app {
      max-width: none
    }

    #rot {
      position: fixed;
      inset: 0;
      background: #0f2a20;
      color: #fff;
      z-index: 99;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      padding: 20px;
      line-height: 1.5
    }

    @media(orientation:portrait) and (max-width:900px) {
      #rot {
        display: flex
      }
    }

    #map.on {
      display: block;
      padding: 0
    }

    #cM {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      flex: none;
      box-shadow: none
    }

    #hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      width: auto;
      z-index: 3;
      padding: 4px 10px
    }

    #goal {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      max-width: 80%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    #ctl {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      width: auto;
      z-index: 3;
      pointer-events: none
    }

    #ctl>* {
      pointer-events: auto
    }

    .dp {
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 46px)
    }

    #ab {
      flex: none;
      min-width: 170px
    }

    .cc {
      display: flex;
      gap: 26px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 920px
    }

    .cl {
      flex: none
    }

    .cr {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-start;
      text-align: left;
      max-height: 100%;
      overflow: auto
    }

    .opt {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px
    }
